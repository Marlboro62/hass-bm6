name: Validation HACS

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  hacs:
    name: "Validation HACS"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Récupérer le dépôt"
        uses: "actions/checkout@v4"

      - name: "Lancer la validation HACS"
        uses: "hacs/action@main"
        with:
          category: "integration"
          ignore: "brands"
