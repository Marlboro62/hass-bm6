name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: "Créer la release"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Récupérer le dépôt"
        uses: "actions/checkout@v4"

      - name: "Vérifier que le tag correspond à la version"
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version custom_components/bm6/manifest.json)
          const=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' custom_components/bm6/const.py)
          echo "tag=$tag manifest=$manifest const=$const"
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$const" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à manifest.json ($manifest) / const.py ($const)"
            exit 1
          fi

      - name: "Publier la release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
