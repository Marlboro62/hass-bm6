name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: "Créer la release"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Récupérer le dépôt"
        uses: "actions/checkout@v4"

      - name: "Déterminer le tag"
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "TAG=v$(jq -r .version custom_components/bm6/manifest.json)" >> "$GITHUB_ENV"
          fi

      - name: "Vérifier que le tag correspond à la version"
        run: |
          tag="${TAG#v}"
          manifest=$(jq -r .version custom_components/bm6/manifest.json)
          const=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' custom_components/bm6/const.py)
          echo "tag=$tag manifest=$manifest const=$const"
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$const" ]; then
            echo "::error::Le tag $TAG ne correspond pas à manifest.json ($manifest) / const.py ($const)"
            exit 1
          fi

      - name: "Publier la release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
